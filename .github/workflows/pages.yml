name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default remains read-only. Write scopes are granted only on the jobs that need them.
# GitHub tokens still cannot be limited to the content/ directory.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Check Pages base path
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${PAGES_BASE%/}"
          if [ "$base" != "/fresh-reads" ]; then
            echo "GitHub Pages base path is '${PAGES_BASE}', expected /fresh-reads."
            echo "The site is built for https://yorks0n.github.io/fresh-reads/."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
